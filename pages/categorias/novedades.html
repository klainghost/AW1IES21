<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA RANITA 3D - Novedades</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main>
        <h1>Novedades</h1>
        <p>Mantente atento a nuestras últimas actualizaciones y lanzamientos exclusivos.</p>

        <div class="products-container">
            <div class="product-card">
                <img src="../../images/logo.png" alt="Novedades" class="product-card__image">
                <div class="product-card__body">
                    <h3 class="product-card__title">¡Se Vienen Cositas!</h3>
                    <p class="product-card__description">Estamos trabajando en sorpresas especiales para ti. Nuevos diseños, productos exclusivos y colaboraciones emocionantes están en camino.</p>
                    <p class="product-card__price">PROXIMAMENTE</p>
                    <button class="product-card__button">Notificarme</button>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../../js/data/navLinks.js"></script>
    <script src="../../js/components/navbar.js"></script>
    <script src="../../js/components/footer.js"></script>
    <script src="../../js/controllers/logout.js"></script>
</body>
</html>
